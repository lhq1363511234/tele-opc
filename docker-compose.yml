services:
  api:
    build: .
    command: npm run start
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TELE_OPC_HOST_PORT:-3100}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tele_opc}:${POSTGRES_PASSWORD:-tele_opc_password}@postgres:5432/${POSTGRES_DB:-tele_opc}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - runtime-data:/app/runtime

  worker:
    build: .
    command: npm run worker:prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tele_opc}:${POSTGRES_PASSWORD:-tele_opc_password}@postgres:5432/${POSTGRES_DB:-tele_opc}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - runtime-data:/app/runtime

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tele_opc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tele_opc_password}
      POSTGRES_DB: ${POSTGRES_DB:-tele_opc}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  runtime-data:
  caddy-data:
  caddy-config:
